name: wowwow

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/heaseung-test:latest .

      - name: Push Docker image to DockerHub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/heaseung-test:latest

      - name: Deploy to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ubuntu
          USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key
      
          # Check if HOST is resolved properly
          echo "Testing connection to $HOST"
          ping -c 3 $HOST || (echo "Host $HOST is not reachable" && exit 1)
      
          # Deploy application
          scp -o StrictHostKeyChecking=no -i private_key docker-compose.yml $USER@$HOST:~/haeseung-test/docker-compose.yml
          ssh -o StrictHostKeyChecking=no -i private_key -T $USER@$HOST << EOF
          docker pull ${{ secrets.DOCKER_USERNAME }}/haeseung-test:latest
          docker-compose -f ~/haeseung/docker-compose.yml up -d
          EOF

