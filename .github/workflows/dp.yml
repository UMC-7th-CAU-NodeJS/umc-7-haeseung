name: wowwow

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Login to docker hub
        run: sudo docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Build docekr image
        run: sudo docker build -t haeseung392/haeseung-test .

      - name: Publish image to docker hub
        run: sudo docker push haeseung392/haeseung-test:latest

  deploy:
    needs: build
    runs-on: [aws-ec2]
    steps:
      - name: Delete old container
        run: docker rm -f test-cont

      - name: Delete old image
        run: docker image rm haeseung392/haeseung-test:latest
      
      - name: Pull image from docker hub
        run: docker pull haeseung392/haeseung-test:latest

      - name: Run docker container 
        run: docker run -d -p 3000:3000 --env-file /home/ubuntu/.env --name test-cont haeseung392/haeseung-test:latest
